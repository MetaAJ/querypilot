[project]
name = "querypilot"
version = "0.1.0"
description = "Evidence-first analytics and forecasting copilot for TrueForge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "mcp>=1.13,<2",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querypilot"]
